<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Video</title><style>html,body{margin:0;height:100%;width:100%;background:#000;overflow:hidden;position:fixed;inset:0}#wrap{position:absolute;inset:0;overflow:hidden}#player{position:absolute;left:0;top:-90px;width:100%;height:calc(100% + 180px);border:0;pointer-events:none}#shield{position:absolute;inset:0;z-index:1;cursor:pointer}.b{position:absolute;right:12px;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer}#x{top:12px}#snd{bottom:12px}</style></head><body><div id="wrap"><div id="player"></div></div><div id="shield"></div><button id="x" class="b" aria-label="Close">&#10005;</button><button id="snd" class="b" aria-label="Sound">&#128266;</button><script>
var V='ZfJIwrnLnrM',P,ready=false,muted=false,snd=document.getElementById('snd');
function setMute(m){muted=m;m?P.mute():P.unMute();snd.innerHTML=m?'&#128263;':'&#128266;'}
function onYouTubeIframeAPIReady(){P=new YT.Player('player',{host:'https://www.youtube-nocookie.com',videoId:V,playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1,iv_load_policy:3,loop:1,playlist:V},events:{onReady:function(e){ready=true;setMute(false);P.playVideo();setTimeout(function(){if(P.getPlayerState()!==1){setMute(true);P.playVideo()}},1500)}}})}
document.getElementById('shield').onclick=function(){if(!ready)return;if(muted&&P.getPlayerState()===1){setMute(false);return}P.getPlayerState()===1?P.pauseVideo():P.playVideo()};
snd.onclick=function(){if(ready)setMute(!muted)};
document.getElementById('x').onclick=function(){window.close();setTimeout(function(){history.length>1?history.back():location.href='./'},200)};
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
