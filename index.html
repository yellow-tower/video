<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Video</title><style>html,body{margin:0;height:100%;width:100%;background:#000;overflow:hidden;position:fixed;inset:0}#wrap{position:absolute;inset:0;overflow:hidden}#player{position:absolute;left:0;top:-90px;width:100%;height:calc(100% + 180px);border:0;pointer-events:none}#shield{position:absolute;inset:0;z-index:1;cursor:pointer;touch-action:pan-y}.b{display:none;position:absolute;right:12px;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:44px;padding:0;cursor:pointer}#x{top:12px}#snd{bottom:12px}#big{top:12px;right:64px}body.on #x,body.on #snd{display:block}body.on.nofs #big{display:block}</style></head><body><div id="wrap"><div id="player"></div></div><div id="shield"></div><button id="x" class="b" aria-label="Close">&#10005;</button><button id="big" class="b" aria-label="Full screen">&#x26F6;</button><button id="snd" class="b" aria-label="Sound">&#128266;</button><script>
var V='ZfJIwrnLnrM',P,ready=false,on=false,muted=true,want=true,inView=true,tries=0,d=document.documentElement,B=document.body,snd=document.getElementById('snd');
var canFs=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function onYouTubeIframeAPIReady(){P=new YT.Player('player',{host:'https://www.youtube-nocookie.com',videoId:V,playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1,iv_load_policy:3,loop:1,playlist:V},events:{onReady:function(){ready=true;P.mute();sync()},onStateChange:function(e){if(e.data===1)tries=0;else if(want&&e.data!==3&&tries<8){tries++;setTimeout(sync,400)}}}})}
function sync(){if(!ready)return;want?P.playVideo():P.pauseVideo()}
function setMute(m){muted=m;m?P.mute():P.unMute();snd.innerHTML=m?'&#128263;':'&#128266;'}
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function setOn(v){on=v;B.classList.toggle('on',v);if(v){setMute(false);want=true}else{setMute(true);want=inView}tries=0;sync()}
function goFs(){if(!canFs){B.classList.add('nofs');return}try{var q=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(q&&q.catch)q.catch(function(){B.classList.add('nofs')})}catch(e){B.classList.add('nofs')}}
function ch(){if(!fsEl()&&on)setOn(false)}
document.addEventListener('fullscreenchange',ch);document.addEventListener('webkitfullscreenchange',ch);
document.addEventListener('visibilitychange',function(){if(!document.hidden){tries=0;sync()}});
new IntersectionObserver(function(e){inView=e[0].isIntersecting;if(on)return;want=inView;tries=0;sync()},{threshold:0.6}).observe(B);
document.getElementById('shield').onclick=function(){if(!ready)return;if(!on){goFs();setOn(true);return}want=!want;tries=0;sync()};
snd.onclick=function(){setMute(!muted)};
document.getElementById('big').onclick=function(){P.pauseVideo();want=false;window.open('watch.html','_blank')};
document.getElementById('x').onclick=function(){if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else setOn(false)};
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
