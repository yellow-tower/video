<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video</title><style>html,body{margin:0;height:100%;width:100%;background:#000;overflow:hidden}#wrap{position:absolute;inset:0;background:#000;cursor:pointer;touch-action:pan-y}#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}#play{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .3s}body.playing #play{opacity:0}.b{display:none;position:absolute;right:12px;z-index:2;width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.55);padding:0;cursor:pointer;align-items:center;justify-content:center}#x{top:12px}#big{top:12px;right:60px}#snd{bottom:12px}body.on .b{display:flex}svg{display:block}</style></head><body><div id="wrap"><video id="v" src="video.mp4" poster="poster.jpg" autoplay muted loop playsinline webkit-playsinline preload="auto"></video><div id="play"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg></div></div><button id="x" class="b" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button><button id="big" class="b" aria-label="Full screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button><button id="snd" class="b" aria-label="Sound"></button><script>
var v=document.getElementById('v'),B=document.body,d=document.documentElement,snd=document.getElementById('snd'),on=false,userPaused=false,inView=true;
var SP='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="#fff"/>',IC={on:SP+'<path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',off:SP+'<path d="m22 9-6 6M16 9l6 6"/></svg>'};
function icon(){snd.innerHTML=v.muted?IC.off:IC.on}icon();
function play(){var p=v.play();if(p&&p.catch)p.catch(function(){if(!v.muted){v.muted=true;icon();v.play().catch(function(){})}})}
v.addEventListener('playing',function(){B.classList.add('playing')});v.addEventListener('pause',function(){B.classList.remove('playing')});v.addEventListener('volumechange',icon);
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function setOn(x){on=x;B.classList.toggle('on',x);userPaused=false;v.muted=!x;icon();if(x||inView)play();else v.pause()}

snd.onclick=function(){v.muted=!v.muted;if(!v.muted)play()};
document.getElementById('big').onclick=function(){if(d.requestFullscreen&&document.fullscreenEnabled){d.requestFullscreen().catch(function(){})}else if(d.webkitRequestFullscreen&&document.webkitFullscreenEnabled){d.webkitRequestFullscreen()}else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen()}};
document.getElementById('x').onclick=function(){if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);setOn(false)};
v.addEventListener('webkitendfullscreen',function(){if(!userPaused)play()});
new IntersectionObserver(function(e){inView=e[0].isIntersecting;if(inView){if(!userPaused)play()}else v.pause()},{threshold:0.5}).observe(B);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&inView&&!userPaused)play()});
</script></body></html>
